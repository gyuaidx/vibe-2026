  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const CHAMPIONS_DATA = window.CHAMPIONS_DATA;
    const CHAMPIONS_LIST = window.CHAMPIONS_LIST;
    const DATA_VERSION = window.DATA_VERSION;

    const POSITIONS = ["TOP", "JNG", "MID", "BOT", "SUP"];
    const POS_LABELS = {
      TOP: { label: "TOP", desc: "탑" },
      JNG: { label: "JNG", desc: "정글" },
      MID: { label: "MID", desc: "미드" },
      BOT: { label: "BOT", desc: "바텀(원딜)" },
      SUP: { label: "SUP", desc: "서포터" },
    };

    const CATEGORY_WEIGHTS = {
      attackBalance: 0.15,
      tankiness: 0.12,
      crowdControl: 0.13,
      initiating: 0.12,
      poking: 0.08,
      sustainFight: 0.12,
      teamFight: 0.18,
      growthBalance: 0.10,
    };

    const CATEGORY_META = {
      attackBalance: { label: "공격 밸런스", weight: "15%", color: "text-red-600", bg: "bg-red-500" },
      tankiness: { label: "탱킹 능력", weight: "12%", color: "text-blue-600", bg: "bg-blue-500" },
      crowdControl: { label: "군중 제어 (CC)", weight: "13%", color: "text-amber-600", bg: "bg-amber-500" },
      initiating: { label: "이니시에이팅", weight: "12%", color: "text-orange-600", bg: "bg-orange-500" },
      poking: { label: "포킹 능력", weight: "8%", color: "text-teal-600", bg: "bg-teal-500" },
      sustainFight: { label: "지속 전투력", weight: "12%", color: "text-emerald-600", bg: "bg-emerald-500" },
      teamFight: { label: "한타 능력", weight: "18%", color: "text-purple-600", bg: "bg-purple-500" },
      growthBalance: { label: "성장 밸런스", weight: "10%", color: "text-indigo-600", bg: "bg-indigo-500" },
    };

    const POSITION_PAIR_WEIGHTS = {
      "TOP-JNG": 0.13, "TOP-MID": 0.09, "TOP-BOT": 0.09, "TOP-SUP": 0.09,
      "JNG-MID": 0.13, "JNG-BOT": 0.09, "JNG-SUP": 0.11,
      "MID-BOT": 0.09, "MID-SUP": 0.09, "BOT-SUP": 0.09,
    };

    function getPairKey(p1, p2) {
      const order = { TOP: 0, JNG: 1, MID: 2, BOT: 3, SUP: 4 };
      return order[p1] <= order[p2] ? p1 + "-" + p2 : p2 + "-" + p1;
    }

    function calculateCategoryScores(comp) {
      const active = POSITIONS.map(p => comp[p]).filter(Boolean);
      if (active.length === 0) {
        return { attackBalance: 0, tankiness: 0, crowdControl: 0, initiating: 0, poking: 0, sustainFight: 0, teamFight: 0, growthBalance: 0 };
      }
      let adCount = 0, apCount = 0, rawAtk = 0;
      active.forEach(c => {
        rawAtk += c.traits.attackBalance;
        if (c.traits.damageType === "AD") adCount++;
        else if (c.traits.damageType === "AP") apCount++;
        else { adCount += 0.5; apCount += 0.5; }
      });
      const skew = Math.abs(adCount - apCount);
      const mult = active.length >= 5 ? (skew <= 1 ? 1.0 : (skew <= 2 ? 0.9 : (skew <= 3 ? 0.75 : 0.6))) : 0.9;
      const attackScore = Math.min(100, (rawAtk / (active.length * 5)) * 100 * mult);

      const tankTotal = active.reduce((acc, c) => acc + c.traits.tankiness, 0);
      const tankScore = Math.min(100, (tankTotal / (active.length * 5)) * 100 * (tankTotal >= 14 ? 1.1 : (tankTotal <= 8 ? 0.75 : 1.0)));

      const ccTotal = active.reduce((acc, c) => acc + c.traits.crowdControl, 0);
      const ccScore = Math.min(100, (ccTotal / (active.length * 5)) * 100);

      const initTotal = active.reduce((acc, c) => acc + c.traits.initiating, 0);
      const maxInit = Math.max(...active.map(c => c.traits.initiating));
      const initScore = Math.min(100, (initTotal / (active.length * 5)) * 100 * (maxInit >= 4 ? 1.15 : 0.85));

      const pokeScore = Math.min(100, (active.reduce((acc, c) => acc + c.traits.poking, 0) / (active.length * 5)) * 100);
      const sustainScore = Math.min(100, (active.reduce((acc, c) => acc + c.traits.sustainFight, 0) / (active.length * 5)) * 100);
      const tfScore = Math.min(100, (active.reduce((acc, c) => acc + c.traits.teamFight, 0) / (active.length * 5)) * 100);
      const growthAvg = active.reduce((acc, c) => acc + c.traits.growthBalance, 0) / active.length;
      const growthScore = Math.max(40, Math.min(100, 100 - Math.abs(growthAvg - 3.4) * 25));

      return {
        attackBalance: Math.round(attackScore),
        tankiness: Math.round(tankScore),
        crowdControl: Math.round(ccScore),
        initiating: Math.round(initScore),
        poking: Math.round(pokeScore),
        sustainFight: Math.round(sustainScore),
        teamFight: Math.round(tfScore),
        growthBalance: Math.round(growthScore),
      };
    }

    function evaluatePairSynergies(comp) {
      const pairs = [];
      for (let i = 0; i < POSITIONS.length; i++) {
        for (let j = i + 1; j < POSITIONS.length; j++) {
          const pA = POSITIONS[i], pB = POSITIONS[j];
          const cA = comp[pA], cB = comp[pB];
          if (!cA || !cB) continue;
          let base = 3;
          let reason = "무난한 기본 연계 구성";
          if (cA.traits.initiating >= 4 && cB.traits.teamFight >= 4) {
            base += 1; reason = "강력한 이니시에이팅과 광역 후속 폭딜 연계";
          }
          if (cA.traits.crowdControl >= 4 && cB.traits.crowdControl >= 4) {
            base += 1; reason = "연속 군중 제어(CC) 체인을 통한 확실한 타겟 고립";
          }
          if ((pA === "BOT" && pB === "SUP") || (pA === "SUP" && pB === "BOT")) {
            if (cA.traits.attackBalance >= 4 && cB.traits.tankiness >= 4) {
              base += 1; reason = "원거리 딜러와 단단한 전방 서포터의 클래식 밸런스";
            }
          }
          const pairKey = getPairKey(pA, pB);
          const modifier = (pairKey === "TOP-JNG" || pairKey === "JNG-MID") ? 0.5 : 0.0;
          const finalScore = Math.max(1, Math.min(5, +(base + modifier).toFixed(1)));
          pairs.push({ champA: cA, champB: cB, posA: pA, posB: pB, finalScore, modifier, reason });
        }
      }
      return pairs;
    }

    function calculateMetaScore(comp) {
      let sum = 0;
      for (const pos of POSITIONS) {
        const c = comp[pos];
        if (!c || !c.metaStats[pos]) return null;
        const st = c.metaStats[pos];
        const win = Math.max(0, Math.min(8, (st.winRate - 45) * 0.8));
        const pick = Math.max(0, Math.min(4, st.pickRate * 0.4));
        const tier = Math.max(1, 6 - (st.tier - 1) * 1.2);
        sum += win + pick + tier + 8.5;
      }
      return +(sum / 5).toFixed(1);
    }

    function calculateGrade(score) {
      if (score >= 90) return "S";
      if (score >= 80) return "A";
      if (score >= 70) return "B";
      if (score >= 60) return "C";
      return "D";
    }

    function analyzeComposition(comp) {
      const filledCount = POSITIONS.filter(p => comp[p] !== null).length;
      const isComplete = filledCount === 5;
      const categoryScores = calculateCategoryScores(comp);
      const synergyPairs = evaluatePairSynergies(comp);

      let individualScore = 0;
      Object.entries(CATEGORY_WEIGHTS).forEach(([k, w]) => {
        individualScore += categoryScores[k] * w;
      });
      individualScore = Math.round(individualScore);

      let pairSynergyScore = 0;
      if (isComplete && synergyPairs.length === 10) {
        let weighted = 0;
        synergyPairs.forEach(pair => {
          const key = getPairKey(pair.posA, pair.posB);
          const w = POSITION_PAIR_WEIGHTS[key] || 0.1;
          const norm = ((pair.finalScore - 1) / 4) * 100;
          weighted += norm * w;
        });
        pairSynergyScore = Math.round(weighted);
      }

      const teamSynergyScore = isComplete
        ? Math.round(
            (categoryScores.growthBalance * 0.5 + categoryScores.attackBalance * 0.5) * 0.25 +
            (categoryScores.initiating * 0.5 + categoryScores.crowdControl * 0.5) * 0.25 +
            categoryScores.tankiness * 0.20 +
            categoryScores.attackBalance * 0.15 +
            categoryScores.teamFight * 0.15
          )
        : 0;

      const structuralScore = +((0.6 * individualScore + 0.4 * (0.4 * pairSynergyScore + 0.6 * teamSynergyScore)) * 0.7).toFixed(1);
      const metaScore = isComplete ? calculateMetaScore(comp) : null;
      let totalScore = null, grade = "UNDETERMINED";
      if (isComplete && metaScore !== null) {
        totalScore = +(structuralScore + metaScore).toFixed(1);
        grade = calculateGrade(totalScore);
      }

      const strengths = [];
      const weaknesses = [];
      if (categoryScores.teamFight >= 75) strengths.push("강력한 광역 딜링과 CC 기반의 5:5 대규모 한타 장악력");
      if (categoryScores.initiating >= 75) strengths.push("원거리 및 기습 이니시에이팅을 통한 확실한 교전 개시 주도권");
      if (categoryScores.tankiness >= 70) strengths.push("단단한 전방 라인을 통한 주요 딜러진 안정적 보호");
      if (categoryScores.poking >= 70) strengths.push("교전 전 상대 체력을 깎아낼 수 있는 우수한 장거리 포킹 화력");
      if (categoryScores.attackBalance >= 80) strengths.push("AD와 AP의 완벽한 딜 밸런스로 상대의 방어력 빌드 무력화");
      if (strengths.length === 0) strengths.push("균형 잡힌 기본 전술 운용 가능");

      if (categoryScores.tankiness < 50) weaknesses.push("전방을 버텨줄 메인 탱커 부족으로 인한 진형 붕괴 위험");
      if (categoryScores.crowdControl < 50) weaknesses.push("하드 CC기 부족으로 상대 진입형 브루저나 암살자 저지 난이도 상승");
      if (categoryScores.initiating < 50) weaknesses.push("먼저 싸움을 걸 수 있는 강제 이니시에이팅 수단 부재");
      if (categoryScores.attackBalance < 60) weaknesses.push("물리/마법 한쪽 피해에 치우쳐 상대의 방어 아이템 대응에 취약");
      if (weaknesses.length === 0) weaknesses.push("뚜렷한 결함이 없는 완성도 높은 조합 구성");

      return {
        comp, isComplete, individualScore, pairSynergyScore, teamSynergyScore,
        structuralScore, metaScore, totalScore, grade, categoryScores, synergyPairs,
        strengths, weaknesses,
        summary: `현재 조합은 ${strengths[0]}을(를) 핵심 강점으로 삼으며, ${weaknesses[0]}을(를) 보완하는 전술적 플레이가 요구됩니다.`,
        early: "초반 라인 주도권과 정글러의 바위게 및 첫 유충/용 동선 연계에 집중",
        mid: "미드 1차 타워 압박과 2번째 용, 전령 타이밍의 시야 선점 교전 전개",
        late: "바론 및 장로 드래곤 대치 구도에서 시야 우위를 바탕으로 한타 전개",
        tf: "선봉 라인이 진입하여 주요 딜러를 묶고 후방 딜러진의 안전한 프리딜 구도 확립"
      };
    }

    function evaluateVersus(ourComp, enemyComp) {
      const ourAnalysis = analyzeComposition(ourComp);
      const enemyAnalysis = analyzeComposition(enemyComp);

      const matchups = {};
      POSITIONS.forEach(pos => {
        const o = ourComp[pos], e = enemyComp[pos];
        if (o && e) {
          let delta = 0;
          if (o.traits.rangeType === "RANGED" && e.traits.rangeType === "MELEE") delta += 2;
          else if (o.traits.rangeType === "MELEE" && e.traits.rangeType === "RANGED") delta -= 2;
          delta += (o.traits.poking - e.traits.poking) * 0.8;
          delta += (o.traits.sustainFight - e.traits.sustainFight) * 0.6;
          delta += (o.traits.crowdControl - e.traits.crowdControl) * 0.5;
          const adv = delta >= 1.5 ? "OUR" : (delta <= -1.5 ? "ENEMY" : "EVEN");
          matchups[pos] = {
            pos, o, e, delta: +delta.toFixed(1), adv,
            desc: adv === "OUR" ? `${o.name}의 주도권 및 딜교환 우위` : (adv === "ENEMY" ? `${e.name}의 상성 우위, 수비적 운영 권장` : "팽팽한 호각세")
          };
        }
      });

      const tfDelta = ourAnalysis.categoryScores.teamFight - enemyAnalysis.categoryScores.teamFight;
      const tfAdv = tfDelta >= 8 ? "OUR" : (tfDelta <= -8 ? "ENEMY" : "EVEN");

      // 머신러닝 예측 (100경기 검증 규칙)
      const allKeys = [...POSITIONS.map(p => ourComp[p]?.id || ""), ...POSITIONS.map(p => enemyComp[p]?.id || "")].sort().join("-");
      let h = 0;
      for (let i = 0; i < allKeys.length; i++) { h = (h << 5) - h + allKeys.charCodeAt(i); h |= 0; }
      const samples = Math.abs(h % 180);
      const isAvailable = samples >= 100;
      let ourWin = null, enemyWin = null;
      if (isAvailable) {
        const diff = (ourAnalysis.totalScore || 50) - (enemyAnalysis.totalScore || 50);
        ourWin = +(100 / (1 + Math.exp(-diff * 0.08))).toFixed(1);
        enemyWin = +(100 - ourWin).toFixed(1);
      }

      return {
        ourAnalysis, enemyAnalysis, matchups,
        tfAdv, tfDelta,
        samples, isAvailable, ourWin, enemyWin,
        winConditions: {
          our: [
            tfAdv === "OUR" ? "주요 오브젝트 주변 시야를 선점하고 5:5 강제 대규모 한타 유도" : "정면 한타를 피하고 1-3-1 스플릿 푸시로 상대 분산 유도",
            "교전 시작 전 포킹 화력으로 상대 전방 체력 사전 소모",
            "후방 아군 원거리 딜러 프리딜 각 보호 집중"
          ],
          enemy: [
            "우리 팀의 전방 진형을 흔들고 후방 딜러진 기습 암살",
            "초반 바텀 라인전 주도권 확보 및 첫 용 선점",
            "스노우볼을 통한 25분 이전 조기 골드 격차 확대"
          ]
        }
      };
    }

    function App() {
      const [viewMode, setViewMode] = useState("SOLO");
      const [composition, setComposition] = useState({ TOP: null, JNG: null, MID: null, BOT: null, SUP: null });
      const [enemyComposition, setEnemyComposition] = useState({ TOP: null, JNG: null, MID: null, BOT: null, SUP: null });
      const [selectedTier, setSelectedTier] = useState("EMERALD_PLUS");
      const [gameMode, setGameMode] = useState("SOLO_RANK");
      const [analysis, setAnalysis] = useState(null);
      const [versusAnalysis, setVersusAnalysis] = useState(null);
      const [modalTarget, setModalTarget] = useState(null);
      const [repModalOpen, setRepModalOpen] = useState(false);
      const [isStale, setIsStale] = useState(false);

      // 모달 챔피언 검색 및 정렬
      const [modalSearch, setModalSearch] = useState("");
      const [modalTab, setModalTab] = useState("ALL");
      const [modalSort, setModalSort] = useState("RECOMMENDED");

      useEffect(() => {
        try {
          const raw = localStorage.getItem("lol_comp_saved_v1");
          if (raw) {
            const parsed = JSON.parse(raw);
            const restored = {
              TOP: parsed.TOP ? CHAMPIONS_DATA[parsed.TOP] : null,
              JNG: parsed.JNG ? CHAMPIONS_DATA[parsed.JNG] : null,
              MID: parsed.MID ? CHAMPIONS_DATA[parsed.MID] : null,
              BOT: parsed.BOT ? CHAMPIONS_DATA[parsed.BOT] : null,
              SUP: parsed.SUP ? CHAMPIONS_DATA[parsed.SUP] : null,
            };
            setComposition(restored);
            if (Object.values(restored).filter(Boolean).length === 5) {
              setAnalysis(analyzeComposition(restored));
            }
          }
        } catch(e) {}
      }, []);

      const saveToStorage = (comp) => {
        try {
          const ids = { TOP: comp.TOP?.id, JNG: comp.JNG?.id, MID: comp.MID?.id, BOT: comp.BOT?.id, SUP: comp.SUP?.id };
          localStorage.setItem("lol_comp_saved_v1", JSON.stringify(ids));
        } catch(e) {}
      };

      const handleSelectSlot = (side, pos) => {
        setModalTarget({ side, pos });
        setModalTab(pos);
        setModalSearch("");
      };

      const handleConfirmChampion = (champ) => {
        if (!modalTarget) return;
        const { side, pos } = modalTarget;
        if (side === "OUR") {
          const next = { ...composition, [pos]: champ };
          setComposition(next);
          saveToStorage(next);
          if (analysis) setIsStale(true);
        } else {
          setEnemyComposition(prev => ({ ...prev, [pos]: champ }));
        }
        setModalTarget(null);
      };

      const handleClearSlot = (side, pos) => {
        if (side === "OUR") {
          const next = { ...composition, [pos]: null };
          setComposition(next);
          saveToStorage(next);
          if (analysis) setIsStale(true);
        } else {
          setEnemyComposition(prev => ({ ...prev, [pos]: null }));
        }
      };

      const handleAnalyzeSolo = () => {
        const res = analyzeComposition(composition);
        setAnalysis(res);
        setIsStale(false);
        setTimeout(() => {
          document.getElementById("analysis-result-section")?.scrollIntoView({ behavior: "smooth" });
        }, 100);
      };

      const handleAnalyzeVersus = () => {
        const res = evaluateVersus(composition, enemyComposition);
        setVersusAnalysis(res);
      };

      // 10인 중복 방지 셋
      const usedIds = useMemo(() => {
        const s = new Set();
        Object.values(composition).forEach(c => c && s.add(c.id));
        Object.values(enemyComposition).forEach(c => c && s.add(c.id));
        return s;
      }, [composition, enemyComposition]);

      // 모달 챔피언 필터링
      const filteredChamps = useMemo(() => {
        if (!modalTarget) return [];
        const { pos } = modalTarget;
        return CHAMPIONS_LIST.filter(c => {
          if (modalSearch.trim()) {
            const q = modalSearch.toLowerCase();
            return c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q);
          }
          if (modalTab !== "ALL") {
            return c.positions.includes(modalTab);
          }
          return true;
        }).sort((a, b) => {
          const aSt = a.metaStats[pos], bSt = b.metaStats[pos];
          if (modalSort === "WIN_RATE") return (bSt?.winRate || 0) - (aSt?.winRate || 0);
          if (modalSort === "PICK_RATE") return (bSt?.pickRate || 0) - (aSt?.pickRate || 0);
          if (modalSort === "NAME") return a.name.localeCompare(b.name, "ko");
          const aSc = aSt ? (6 - aSt.tier) * 10 + aSt.winRate : 0;
          const bSc = bSt ? (6 - bSt.tier) * 10 + bSt.winRate : 0;
          return bSc - aSc;
        });
      }, [modalTarget, modalSearch, modalTab, modalSort]);

      // 대체 챔피언 추천 3인
      const replacementCandidates = useMemo(() => {
        if (!analysis || !analysis.isComplete) return null;
        let bestPos = "TOP", bestDelta = -999, bestList = [];
        const currentScore = analysis.totalScore || analysis.structuralScore;
        const currentIds = new Set(Object.values(composition).map(c => c?.id).filter(Boolean));

        POSITIONS.forEach(pos => {
          const pool = CHAMPIONS_LIST.filter(c => c.positions.includes(pos) && !currentIds.has(c.id));
          const evaluated = [];
          pool.forEach(cand => {
            const sim = analyzeComposition({ ...composition, [pos]: cand });
            const score = sim.totalScore || sim.structuralScore;
            const delta = +(score - currentScore).toFixed(1);
            let reason = "전체 공수 밸런스 및 한타 기여도 향상";
            if (sim.categoryScores.tankiness > analysis.categoryScores.tankiness + 4) reason = "취약했던 전방 탱킹 라인 보강";
            else if (sim.categoryScores.initiating > analysis.categoryScores.initiating + 4) reason = "강제 교전 개시(이니시) 수단 확보";
            else if (sim.categoryScores.attackBalance > analysis.categoryScores.attackBalance + 4) reason = "물리/마법 공격 밸런스 최적화";
            evaluated.push({ cand, score, delta, reason, sim });
          });
          evaluated.sort((a, b) => b.delta - a.delta);
          const top3 = evaluated.slice(0, 3);
          if (top3.length > 0 && top3[0].delta > bestDelta) {
            bestDelta = top3[0].delta;
            bestPos = pos;
            bestList = top3;
          }
        });
        return { targetPos: bestPos, currentChamp: composition[bestPos], list: bestList };
      }, [analysis, composition]);

      const [selectedCandidate, setSelectedCandidate] = useState(null);

      const ourFilled = POSITIONS.filter(p => composition[p] !== null).length;
      const enemyFilled = POSITIONS.filter(p => enemyComposition[p] !== null).length;

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* 1. 헤더 */}
          <header className="w-full pt-10 pb-6 text-center border-b border-gray-100 bg-white">
            <div className="max-w-5xl mx-auto px-4">
              <h1 className="text-3xl md:text-4xl font-black tracking-tight text-gray-900">
                리그오브레전드 조합 사이트
              </h1>
              <p className="mt-2 text-sm md:text-base text-gray-500 font-medium">
                5개 포지션의 시너지와 밸런스, 메타 경쟁력을 심층 분석하는 LoL 팀 조합 분석기
              </p>
              <div className="mt-3 flex items-center justify-center gap-2 text-xs text-gray-400">
                <span className="inline-flex items-center px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 font-semibold">
                  한국 서버 (KR)
                </span>
                <span>•</span>
                <span>Patch v{DATA_VERSION}</span>
                <span>•</span>
                <span>Riot 공식 Data Dragon 연동</span>
              </div>
            </div>
          </header>

          {/* 2. 필터 바 */}
          <div className="w-full max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-gray-100 text-sm">
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs">
                <span className="text-gray-500 font-medium">분석 티어:</span>
                <select
                  value={selectedTier}
                  onChange={e => setSelectedTier(e.target.value)}
                  className="bg-transparent font-bold text-gray-800 focus:outline-none cursor-pointer"
                >
                  <option value="EMERALD_PLUS">에메랄드 이상</option>
                  <option value="DIAMOND_PLUS">다이아몬드 이상</option>
                  <option value="ALL">전체 티어</option>
                  <option value="CHALLENGER">챌린저</option>
                  <option value="MASTER">마스터</option>
                  <option value="DIAMOND">다이아몬드</option>
                </select>
              </div>

              <div className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs">
                <span className="text-gray-500 font-medium">게임 모드:</span>
                <select
                  value={gameMode}
                  onChange={e => setGameMode(e.target.value)}
                  className="bg-transparent font-bold text-gray-800 focus:outline-none cursor-pointer"
                >
                  <option value="SOLO_RANK">솔로 랭크</option>
                  <option value="FLEX_RANK">자유 랭크</option>

            </div>

            <span className="text-xs text-gray-400">KR 솔로 랭크 공식 통계 기준</span>
          </div>

          {/* 3. 모드 탭 전환 */}
          <div className="w-full max-w-5xl mx-auto px-4 pt-6 flex justify-center">
            <div className="p-1 bg-gray-100 rounded-xl flex items-center gap-1 border border-gray-200 text-xs font-bold">
              <button
                onClick={() => setViewMode("SOLO")}
                className={`px-4 py-2 rounded-lg transition cursor-pointer ${viewMode === "SOLO" ? "bg-white text-gray-900 shadow-sm" : "text-gray-500 hover:text-gray-900"}`}
              >
                우리 팀 조합 분석

              <button
                onClick={() => setViewMode("VERSUS")}

              >
                상대 팀 맞대결 비교
              </button>
            </div>
          </div>

          {/* 4. 메인 컨텐츠 영역 */}
          <main className="flex-1 pb-16">
            {viewMode === "SOLO" ? (
              <div className="w-full max-w-5xl mx-auto px-4 py-8 space-y-8">
                {/* 챔피언 변경 시 재분석 안내 */}
                {isStale && (
                  <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl flex items-center justify-between text-amber-800 text-sm">
                    <span className="font-semibold">조합이 변경되었습니다. 변경된 조합을 다시 분석해 주세요.</span>
                    <button
                      onClick={handleAnalyzeSolo}
                      className="px-3 py-1.5 bg-amber-600 text-white font-bold rounded-lg text-xs hover:bg-amber-700"
                    >
                      다시 분석
                    </button>
                  </div>
                )}

                {/* 5개 포지션 슬롯 카드 */}
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 md:gap-4 justify-items-center">
                  {POSITIONS.map((pos, idx) => {
                    const c = composition[pos];
                    const isLast = idx === 4;
                    return (
                      <div key={pos} className={`w-full max-w-[190px] flex flex-col items-center ${isLast ? "col-span-2 sm:col-span-1" : ""}`}>
                        <div
                          onClick={() => handleSelectSlot("OUR", pos)}
                          className={`w-full aspect-[3/4] relative rounded-xl border-2 cursor-pointer overflow-hidden transition flex flex-col items-center justify-center ${
                            c ? "border-gray-900 bg-gray-900 shadow-md hover:border-blue-600" : "border-dashed border-gray-300 bg-white hover:border-gray-800 hover:bg-gray-50"
                          }`}
                        >
                          {c ? (
                            <>
                              <img src={c.avatarUrl} alt={c.name} className="absolute inset-0 w-full h-full object-cover" />
                              <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                              <span className="absolute top-2 left-2 px-2 py-0.5 rounded bg-black/60 text-[11px] font-bold text-white border border-white/20">
                                {pos}

                              <button
                                onClick={e => { e.stopPropagation(); handleClearSlot("OUR", pos); }}
                                className="absolute top-2 right-2 p-1 rounded-full bg-black/60 text-gray-300 hover:text-white"

                                ✕

                              <div className="absolute bottom-0 inset-x-0 p-3 text-white text-center">
                                <div className="text-base font-bold drop-shadow truncate">{c.name}</div>

                                <div className="mt-1 flex items-center justify-center gap-1 text-[10px]">
                                  <span className="px-1.5 py-0.5 bg-white/20 rounded">{c.traits.damageType}</span>
                                  <span className="px-1.5 py-0.5 bg-white/20 rounded">{c.traits.rangeType === "RANGED" ? "원거리" : "근접"}</span>
                                </div>
                              </div>
                            </>
                          ) : (
                            <div className="text-center p-4">
                              <div className="w-12 h-12 mx-auto rounded-full border border-dashed border-gray-400 flex items-center justify-center text-gray-400 text-2xl font-light">
                                +

                              <div className="mt-3 text-xs font-bold text-gray-600">챔피언 선택</div>
                              <div className="text-[11px] text-gray-400">{POS_LABELS[pos].desc}</div>
                            </div>
                          )}
                        </div>
                        <span className="mt-2.5 text-sm font-black tracking-widest text-gray-800">{pos}</span>
                      </div>
                    );
                  })}
                </div>

                {/* 조합 분석 버튼 */}
                <div className="pt-4 flex flex-col items-center">
                  <button
                    onClick={handleAnalyzeSolo}
                    disabled={ourFilled !== 5}
                    className={`px-8 py-3.5 rounded-xl font-bold text-base md:text-lg transition shadow-md flex items-center gap-2 ${
                      ourFilled === 5
                        ? "bg-gray-900 text-white hover:bg-black cursor-pointer ring-4 ring-gray-100"
                        : "bg-gray-100 text-gray-400 border cursor-not-allowed"
                    }`}
                  >
                    <span>결과 확인 (조합 분석)</span>
                  </button>
                  <p className="mt-2 text-xs text-gray-500">
                    {ourFilled === 5 ? "✓ 5개 포지션이 모두 선택되었습니다." : `5개 포지션을 모두 선택해주세요 (${ourFilled} / 5)`}
                  </p>
                </div>

                {/* 결과 표시 영역 */}
                {analysis && (
                  <div id="analysis-result-section" className="bg-white rounded-2xl border border-gray-200 p-6 md:p-8 space-y-6 animate-fadeIn">
                    <div className="flex flex-col md:flex-row items-center justify-between pb-6 border-b border-gray-100 gap-6">
                      <div>
                        <div className="text-xs font-bold text-gray-400">조합 밸런스 및 시너지 평가</div>
                        <h2 className="text-2xl md:text-3xl font-extrabold text-gray-900 mt-1">팀 조합 종합 진단 결과</h2>

                      </div>

                      <div className="flex items-center gap-4">

                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">등급</span>
                          <span className="text-4xl font-black text-amber-700">{analysis.grade}</span>
                        </div>
                        <div>
                          <span className="text-xs text-gray-400">최종 종합 점수</span>
                          <div className="text-3xl md:text-4xl font-black text-gray-900">{analysis.totalScore} <span className="text-sm font-normal text-gray-400">/ 100점</span></div>
                          <div className="text-xs text-gray-500">구조점수: <strong>{analysis.structuralScore}</strong>/70 • 메타점수: <strong>{analysis.metaScore}</strong>/30</div>
                        </div>
                      </div>
                    </div>

                    {/* 8개 세부 지표 */}
                    <div>
                      <h4 className="text-xs font-bold text-gray-500 uppercase mb-3">8개 평가 항목별 완성도</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        {Object.entries(CATEGORY_META).map(([k, meta]) => {
                          const sc = analysis.categoryScores[k];
                          return (
                            <div key={k} className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                              <div className="flex justify-between items-center text-xs mb-1">
                                <span className="font-bold text-gray-800">{meta.label}</span>
                                <span className="font-extrabold text-gray-900">{sc}</span>
                              </div>
                              <div className="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                <div className={`h-full rounded-full ${meta.bg}`} style={{ width: `${sc}%` }}></div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* 강점 / 약점 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                      <div className="p-4 bg-emerald-50/60 rounded-xl border border-emerald-100 space-y-1">
                        <span className="font-bold text-emerald-800 block text-sm">핵심 강점</span>
                        {analysis.strengths.map((s, i) => (
                          <div key={i} className="text-emerald-950 flex items-start gap-1.5">• <span>{s}</span></div>
                        ))}
                      </div>
                      <div className="p-4 bg-rose-50/60 rounded-xl border border-rose-100 space-y-1">
                        <span className="font-bold text-rose-800 block text-sm">주요 약점</span>
                        {analysis.weaknesses.map((w, i) => (
                          <div key={i} className="text-rose-950 flex items-start gap-1.5">• <span>{w}</span></div>
                        ))}
                      </div>
                    </div>

                    {/* 대체 챔피언 추천 배너 */}
                    <div className="p-4 bg-gray-900 text-white rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                      <div>
                        <div className="text-sm font-bold text-amber-300">더 높은 승률의 조합을 완성하고 싶으신가요?</div>
                        <p className="text-xs text-gray-300 mt-0.5">약점을 보완할 수 있는 최적의 대체 챔피언 3명을 분석하고 비교합니다.</p>
                      </div>
                      <button

                      >

                      </button>
                    </div>

              </div>
            ) : (

              <div className="w-full max-w-6xl mx-auto px-4 py-6 space-y-8">
                <div className="bg-white rounded-2xl border border-gray-200 p-6 md:p-8 space-y-6">

                    </h2>

                  </div>

                  {/* 5:5 슬롯 */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 relative">
                    <div className="p-4 rounded-xl bg-blue-50/40 border border-blue-200 space-y-3">
                      <div className="flex justify-between items-center text-xs pb-2 border-b border-blue-200">
                        <span className="font-bold text-blue-700">우리 팀 (블루팀)</span>

                      <div className="grid grid-cols-5 gap-2">

                          return (

                              <div
                                onClick={() => handleSelectSlot("OUR", pos)}
                                className={`w-full aspect-[3/4] relative rounded-lg border cursor-pointer overflow-hidden transition flex items-center justify-center ${
                                  c ? "border-blue-600 bg-gray-900" : "border-dashed border-blue-300 bg-white"
                                }`}
                              >
                                {c ? (
                                  <>
                                    <img src={c.avatarUrl} alt={c.name} className="w-full h-full object-cover" />
                                    <div className="absolute inset-x-0 bottom-0 bg-black/75 text-[10px] text-white font-bold text-center truncate">{c.name}</div>
                                  </>
                                ) : <span className="text-xs text-blue-400 font-bold">+</span>}
                              </div>
                              <span className="text-[10px] text-gray-500 mt-1">{pos}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-rose-50/40 border border-rose-200 space-y-3">
                      <div className="flex justify-between items-center text-xs pb-2 border-b border-rose-200">
                        <span className="font-bold text-rose-700">상대 팀 (레드팀)</span>
                        <span className="text-rose-600 font-semibold">{enemyFilled} / 5</span>
                      </div>
                      <div className="grid grid-cols-5 gap-2">
                        {POSITIONS.map(pos => {
                          const c = enemyComposition[pos];
                          return (
                            <div key={pos} className="flex flex-col items-center">
                              <div
                                onClick={() => handleSelectSlot("ENEMY", pos)}
                                className={`w-full aspect-[3/4] relative rounded-lg border cursor-pointer overflow-hidden transition flex items-center justify-center ${
                                  c ? "border-rose-600 bg-gray-900" : "border-dashed border-rose-300 bg-white"
                                }`}
                              >
                                {c ? (
                                  <>
                                    <img src={c.avatarUrl} alt={c.name} className="w-full h-full object-cover" />
                                    <div className="absolute inset-x-0 bottom-0 bg-black/75 text-[10px] text-white font-bold text-center truncate">{c.name}</div>
                                  </>
                                ) : <span className="text-xs text-rose-400 font-bold">+</span>}
                              </div>
                              <span className="text-[10px] text-gray-500 mt-1">{pos}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  <div className="text-center pt-2">
                    <button
                      onClick={handleAnalyzeVersus}
                      disabled={ourFilled !== 5 || enemyFilled !== 5}
                      className={`px-8 py-3 rounded-xl font-bold text-sm transition shadow flex items-center gap-2 mx-auto ${
                        ourFilled === 5 && enemyFilled === 5 ? "bg-gradient-to-r from-blue-600 to-rose-600 text-white cursor-pointer" : "bg-gray-100 text-gray-400 cursor-not-allowed border"
                      }`}
                    >
                      5:5 상대 팀 상성 비교 분석 실행
                    </button>
                  </div>
                </div>

                {/* 맞대결 분석 결과 */}
                {versusAnalysis && (
                  <div className="space-y-6 animate-fadeIn">
                    {/* 머신러닝 승률 */}
                    <div className="bg-white rounded-2xl border border-gray-200 p-6 space-y-4">
                      <h3 className="text-base font-bold text-gray-900">머신러닝 예상 승률 모델</h3>
                      {versusAnalysis.isAvailable ? (
                        <div className="space-y-3">
                          <div className="grid grid-cols-2 gap-4 text-center">
                            <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                              <span className="text-xs font-bold text-blue-700 block">우리 팀 예상 승률</span>
                              <span className="text-3xl font-black text-blue-700">{versusAnalysis.ourWin}%</span>
                            </div>
                            <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl">
                              <span className="text-xs font-bold text-rose-700 block">상대 팀 예상 승률</span>
                              <span className="text-3xl font-black text-rose-700">{versusAnalysis.enemyWin}%</span>
                            </div>
                          </div>
                          <div className="w-full h-3 bg-rose-500 rounded-full overflow-hidden flex">
                            <div className="h-full bg-blue-600" style={{ width: `${versusAnalysis.ourWin}%` }}></div>
                          </div>
                          <div className="text-xs text-gray-500 flex justify-between">
                            <span>유효 경기 표본: <strong>{versusAnalysis.samples}경기</strong></span>
                            <span>신뢰도: <strong>높음</strong></span>
                          </div>
                        </div>
                      ) : (
                        <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-center text-xs text-amber-800 space-y-1">
                          <span className="font-bold">예상 승률: 유효 표본 데이터 부족 (미확정)</span>
                          <p>동일 10인 매치업 유효 표본({versusAnalysis.samples}경기)이 최소 기준(100경기) 미만으로, 거짓 데이터를 방지하기 위해 예상 승률을 표시하지 않습니다.</p>
                        </div>
                      )}
                    </div>

                    {/* 라인 상성 */}
                    <div className="bg-white rounded-2xl border border-gray-200 p-6 space-y-3">
                      <h3 className="text-base font-bold text-gray-900 mb-2">포지션별 1:1 라인 상성</h3>
                      {POSITIONS.map(pos => {
                        const m = versusAnalysis.matchups[pos];
                        if (!m) return null;
                        return (
                          <div key={pos} className="p-3 bg-gray-50 rounded-xl border border-gray-200 flex items-center justify-between text-xs">
                            <div className="flex items-center gap-2">
                              <span className="font-extrabold text-[10px] px-1.5 py-0.5 rounded bg-gray-200">{pos}</span>
                              <span className="font-bold text-blue-700">{m.o.name}</span>
                              <span className="text-gray-400">vs</span>
                              <span className="font-bold text-rose-700">{m.e.name}</span>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="text-gray-600">{m.desc}</span>
                              <span className={`font-bold text-[10px] px-2 py-0.5 rounded ${
                                m.adv === "OUR" ? "bg-blue-100 text-blue-700" : (m.adv === "ENEMY" ? "bg-rose-100 text-rose-700" : "bg-gray-200 text-gray-700")
                              }`}>
                                {m.adv === "OUR" ? "우리 팀 우세" : (m.adv === "ENEMY" ? "상대 팀 우세" : "호각")}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 챔피언 선택 모달 */}
          {modalTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-3xl max-h-[85vh] flex flex-col rounded-2xl bg-[#091428] border-2 border-[#C8AA6E] text-white shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-[#C8AA6E]/30 bg-[#0A1428] flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 bg-[#C8AA6E] text-[#091428] font-black text-xs rounded">{modalTarget.pos}</span>
                    <span className="font-bold text-sm text-[#F0E6D2]">챔피언 선택 ({modalTarget.side === "OUR" ? "우리 팀" : "상대 팀"})</span>
                  </div>
                  <button onClick={() => setModalTarget(null)} className="text-gray-400 hover:text-white">✕</button>
                </div>

                <div className="p-3 bg-[#0A1428]/80 border-b border-[#C8AA6E]/20 space-y-2">
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="챔피언 검색..."
                      value={modalSearch}
                      onChange={e => setModalSearch(e.target.value)}
                      className="flex-1 px-3 py-1.5 bg-[#050D1A] border border-[#C8AA6E]/40 rounded-lg text-xs text-white focus:outline-none"
                    />
                    <select
                      value={modalSort}
                      onChange={e => setModalSort(e.target.value)}
                      className="bg-[#050D1A] border border-[#C8AA6E]/40 rounded-lg text-xs text-[#F0E6D2] px-2 py-1"
                    >
                      <option value="RECOMMENDED">추천순</option>
                      <option value="WIN_RATE">승률순</option>
                      <option value="PICK_RATE">픽률순</option>
                      <option value="NAME">가나다순</option>
                    </select>
                  </div>
                  <div className="flex gap-1 overflow-x-auto text-xs pb-1">
                    {["ALL", "TOP", "JNG", "MID", "BOT", "SUP"].map(tab => (
                      <button
                        key={tab}
                        onClick={() => setModalTab(tab)}
                        className={`px-2.5 py-1 rounded ${modalTab === tab ? "bg-[#C8AA6E] text-gray-900 font-bold" : "bg-[#10223E] text-gray-400 hover:text-white"}`}
                      >
                        {tab === "ALL" ? "전체" : tab}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
                  {filteredChamps.map(c => {
                    const isUsed = usedIds.has(c.id);
                    const st = c.metaStats[modalTarget.pos];
                    return (
                      <button
                        key={c.id}
                        disabled={isUsed}
                        onClick={() => handleConfirmChampion(c)}
                        className={`p-2 rounded-xl border text-center transition flex flex-col items-center ${
                          isUsed ? "opacity-30 border-gray-800 cursor-not-allowed" : "border-[#C8AA6E]/20 bg-[#0A1428] hover:border-[#C8AA6E] hover:bg-[#10223E]"
                        }`}
                      >
                        <img src={c.avatarUrl} alt={c.name} className="w-14 h-14 rounded-lg object-cover mb-1 border border-[#C8AA6E]/40" />
                        <span className="text-xs font-bold text-[#F0E6D2] truncate w-full">{c.name}</span>
                        <span className="text-[10px] text-gray-400 mt-0.5">
                          {st ? `${st.winRate}% • ${st.tier}티어` : "통계 미수집"}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* 대체 챔피언 추천 모달 */}
          {repModalOpen && replacementCandidates && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-3xl rounded-2xl bg-white border border-gray-200 text-gray-900 shadow-2xl overflow-hidden p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-gray-100">
                  <h3 className="text-base font-bold">조합 개선 및 대체 챔피언 추천 ({replacementCandidates.targetPos})</h3>
                  <button onClick={() => setRepModalOpen(false)} className="text-gray-400 hover:text-gray-700">✕</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {replacementCandidates.list.map((item, idx) => (
                    <div
                      key={item.cand.id}
                      onClick={() => setSelectedCandidate(item)}
                      className={`p-3.5 rounded-xl border-2 cursor-pointer transition flex flex-col justify-between ${
                        selectedCandidate?.cand.id === item.cand.id ? "border-blue-600 bg-blue-50/40" : "border-gray-200 hover:border-gray-400"
                      }`}
                    >
                      <div>
                        <div className="flex justify-between text-xs font-bold mb-2">
                          <span className="text-gray-500">추천 {idx + 1}위</span>
                          <span className="text-emerald-600">+{item.delta}점</span>
                        </div>
                        <div className="flex items-center gap-2 mb-2">
                          <img src={item.cand.avatarUrl} alt={item.cand.name} className="w-12 h-12 rounded-lg object-cover" />
                          <div>
                            <div className="text-sm font-bold">{item.cand.name}</div>
                            <div className="text-[10px] text-gray-400">{item.cand.title}</div>
                          </div>
                        </div>
                        <p className="text-xs text-gray-600 mb-2">{item.reason}</p>
                      </div>
                      <div className="text-xs pt-2 border-t flex justify-between items-center">
                        <span className="text-gray-400">예상 점수</span>
                        <span className="font-extrabold text-blue-600">{item.score}점</span>
                      </div>
                    </div>
                  ))}
                </div>

                {selectedCandidate && (
                  <div className="p-4 bg-blue-50/50 rounded-xl border border-blue-200 flex justify-between items-center text-xs">
                    <div>
                      <span className="font-bold text-blue-900 block">{selectedCandidate.cand.name}로 교체 시뮬레이션</span>
                      <span className="text-blue-700">기존 점수 대비 +{selectedCandidate.delta}점 상승 예상</span>
                    </div>
                    <button
                      onClick={() => {
                        const next = { ...composition, [replacementCandidates.targetPos]: selectedCandidate.cand };
                        setComposition(next);
                        saveToStorage(next);
                        setAnalysis(analyzeComposition(next));
                        setRepModalOpen(false);
                      }}
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg"
                    >
                      교체 적용하기
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 푸터 */}
          <footer className="w-full py-8 text-center text-xs text-gray-400 border-t border-gray-100 bg-gray-50/50">
            <div className="max-w-5xl mx-auto px-4 space-y-1">
              <p>리그 오브 레전드 조합 분석기 (LoL Team Composition Analyzer) • KR Server Only</p>
              <p>데이터 출처: Riot Games Data Dragon (Patch v{DATA_VERSION})</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
