<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AETHERIA: 대지에서 심우주로의 항해</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Pretendard:wght@300;400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      touch-action: none; /* 모바일 브라우저 기본 스크롤 및 핀치 줌 방지 */
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* UI 레이어 */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 24px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 24px);
      transition: opacity 0.4s ease;
    }

    #ui-layer.hide-ui {
      opacity: 0;
    }

    .interactive {
      pointer-events: auto;
    }

    /* 상단 좌측: 로고 및 고도/속도 HUD */
    .top-left-hud {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: calc(100% - 150px);
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .game-logo {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 20%, #7dd3fc 60%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(125, 211, 252, 0.4));
    }

    .current-zone-tag {
      font-size: 11.5px;
      letter-spacing: 0.5px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 10px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: inline-block;
      width: fit-content;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .metrics-panel {
      display: flex;
      gap: 12px;
      margin-top: 2px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: fit-content;
    }

    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .metric-label {
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }

    .metric-unit {
      font-size: 10px;
      color: #cbd5e1;
    }

    /* 우측 상단: 항해 미니맵 Overlay */
    .minimap-container {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: env(safe-area-inset-right, 20px);
      width: 120px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.05);
    }

    .minimap-header {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7dd3fc;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .minimap-track {
      position: relative;
      height: 180px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .minimap-line {
      position: absolute;
      width: 2px;
      height: 100%;
      background: linear-gradient(to top, #38bdf8, #818cf8, #c084fc, #f43f5e);
      border-radius: 1px;
      opacity: 0.6;
    }

    .minimap-node {
      position: absolute;
      display: flex;
      align-items: center;
      width: 100%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .minimap-node-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin: 0 auto;
      background: #94a3b8;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }

    .minimap-node-label {
      position: absolute;
      left: 14px;
      font-size: 8px;
      color: #cbd5e1;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .minimap-ship-marker {
      position: absolute;
      width: 9px;
      height: 9px;
      background: #38bdf8;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      left: calc(50% - 4.5px);
      transform: translateY(-50%);
      box-shadow: 0 0 8px #38bdf8, 0 0 16px #38bdf8;
      transition: bottom 0.1s linear;
      z-index: 5;
    }

    /* 상단 우측 퀵 컨트롤 버튼 (사운드, 리셋, UI숨김) */
    .top-action-group {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      right: calc(env(safe-area-inset-right, 20px) + 130px);
      display: flex;
      gap: 6px;
    }

    .hud-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hud-icon-btn:hover, .hud-icon-btn:active {
      background: rgba(30, 41, 59, 0.9);
      border-color: #38bdf8;
      color: #ffffff;
      transform: scale(0.96);
    }

    /* 우측 하단: 항해 속도 조절 슬라이더 (0.3x ~ 4.0x) */
    .speed-slider-card {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      right: env(safe-area-inset-right, 20px);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 190px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-title {
      font-size: 10px;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .slider-mode-tag {
      font-size: 10px;
      color: #38bdf8;
      font-weight: 700;
      font-family: monospace;
    }

    .speed-slider-card input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      touch-action: pan-x;
    }

    .speed-slider-card input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      border: 2px solid #ffffff;
    }

    .slider-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: #64748b;
    }

    /* 하단 중앙: 중력 닻 및 조작 가이드 바 */
    .bottom-center-hud {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 50%;
      transform: translateX(-50%);
    }

    .anchor-btn {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #e2e8f0;
      padding: 9px 22px;
      border-radius: 26px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      touch-action: manipulation;
    }

    .anchor-btn:active {
      transform: scale(0.95);
    }

    .anchor-btn.active {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(99, 102, 241, 0.85));
      border-color: #bae6fd;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
      animation: anchorPulse 2s infinite ease-in-out;
    }

    @keyframes anchorPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
      50% { box-shadow: 0 0 28px rgba(56, 189, 248, 0.9); }
    }

    .hud-controls-help {
      display: flex;
      gap: 8px;
      font-size: 10px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 9px;
      color: #ffffff;
      font-family: monospace;
    }

    /* 궤도 관람 안내 배너 */
    .orbit-banner {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 18px;
      padding: 8px 18px;
      font-size: 12px;
      color: #bae6fd;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      z-index: 20;
      white-space: nowrap;
      max-width: 90%;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .orbit-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 초기 중앙 이륙 (LAUNCH) 모달 & 시네마틱 */
    #launch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(3, 7, 18, 0.3) 0%, rgba(3, 7, 18, 0.88) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s ease;
      padding: 20px;
    }

    #launch-overlay.launched {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .launch-card {
      text-align: center;
      max-width: 440px;
      width: 100%;
      padding: 34px 26px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(56, 189, 248, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .launch-earth-icon {
      font-size: 42px;
      filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.8));
      animation: floatEarth 4s ease-in-out infinite;
    }

    @keyframes floatEarth {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .launch-card h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f8fafc;
    }

    .launch-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
    }

    .launch-btn {
      margin-top: 8px;
      padding: 14px 40px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #030712;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }

    .launch-btn:active {
      transform: scale(0.96);
    }

    /* 모바일 반응형 뷰포트 최적화 */
    @media (max-width: 768px) {
      .game-logo {
        font-size: 19px;
        letter-spacing: 2.5px;
      }
      .metrics-panel {
        padding: 4px 10px;
        gap: 8px;
      }
      .metric-value {
        font-size: 15px;
      }
      .minimap-container {
        width: 95px;
        top: env(safe-area-inset-top, 14px);
        right: env(safe-area-inset-right, 14px);
        padding: 8px 6px;
      }
      .minimap-track {
        height: 140px;
      }
      .top-action-group {
        top: env(safe-area-inset-top, 14px);
        right: calc(env(safe-area-inset-right, 14px) + 105px);
      }
      .hud-icon-btn {
        width: 30px;
        height: 30px;
      }
      .speed-slider-card {
        right: env(safe-area-inset-right, 14px);
        bottom: env(safe-area-inset-bottom, 14px);
        width: 140px;
        padding: 8px 10px;
      }
      .bottom-center-hud {
        left: 20px;
        transform: none;
        bottom: env(safe-area-inset-bottom, 14px);
      }
      .hud-controls-help {
        display: none; /* 모바일에서는 터치 집중을 위해 텍스트 힌트 숨김 */
      }
      .orbit-banner {
        top: 75px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- 메인 캔버스 -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- UI 오버레이 -->
  <div id="ui-layer">
    <!-- 상단 좌측: 타이틀 및 고도/속도 HUD -->
    <div class="top-left-hud interactive">
      <div class="title-row">
        <h1 class="game-logo">AETHERIA</h1>
      </div>
      <div class="current-zone-tag" id="zoneTag">지구 표면 기지 (Ground Base)</div>
      <div class="metrics-panel">
        <div class="metric-item">
          <span class="metric-label">고도</span>
          <span class="metric-value" id="altDisplay">0</span>
          <span class="metric-unit">km</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">속도</span>
          <span class="metric-value" id="speedDisplay">0</span>
          <span class="metric-unit">AU/h</span>
        </div>
      </div>
    </div>

    <!-- 상단 퀵 버튼 그룹 (사운드, 리셋, UI 숨김) -->
    <div class="top-action-group interactive">
      <button class="hud-icon-btn" id="audioToggleBtn" title="배경 사운드 토글 (M)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <button class="hud-icon-btn" id="resetBtn" title="지구로 귀환 (R)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="hud-icon-btn" id="hideUiBtn" title="풍경 감상 모드 (H)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <!-- 우측 상단: 항해 미니맵 Overlay -->
    <div class="minimap-container interactive" id="minimap">
      <div class="minimap-header">Navigation Track</div>
      <div class="minimap-track" id="minimapTrack">
        <div class="minimap-line"></div>
        <div class="minimap-ship-marker" id="minimapShip"></div>
      </div>
    </div>

    <!-- 궤도 관람 안내 배너 -->
    <div class="orbit-banner" id="orbitBanner">
      <span>⚓</span>
      <span id="orbitBannerText">중력 닻 정박 중 — 천체 궤도에서 풍경을 감상하고 있습니다</span>
    </div>

    <!-- 하단: 중력 닻 토글 및 조작 힌트 -->
    <div class="bottom-center-hud interactive">
      <button class="anchor-btn" id="anchorToggleBtn">
        <span class="anchor-symbol">⚓</span>
        <span id="anchorBtnText">중력 닻 [Space]</span>
      </button>
      <div class="hud-controls-help">
        <span><kbd>터치/마우스</kbd> 조종 및 추진</span>
        <span><kbd>SPACE</kbd> 궤도 정박</span>
        <span><kbd>H</kbd> UI 숨김</span>
        <span><kbd>R</kbd> 재이륙</span>
      </div>
    </div>

    <!-- 우측 하단: 항해 속도 조절 슬라이더 (0.3x ~ 4.0x) -->
    <div class="speed-slider-card interactive">
      <div class="slider-header">
        <span class="slider-title">Warp Speed</span>
        <span class="slider-mode-tag" id="warpModeTag">1.0x</span>
      </div>
      <input type="range" id="speedSlider" min="0.3" max="4.0" step="0.1" value="1.0">
      <div class="slider-ticks">
        <span>0.3x Drift</span>
        <span>1.0x</span>
        <span>4.0x Warp</span>
      </div>
    </div>
  </div>

  <!-- 중앙의 [지구 이륙 시작 (LAUNCH)] 오버레이 -->
  <div id="launch-overlay">
    <div class="launch-card">
      <div class="launch-earth-icon">🌍</div>
      <h1>AETHERIA</h1>
      <p>
        지구 표면의 노을빛 대기층에서 시작하여 달, 태양계 주요 행성, 그리고 심우주 3색 오로라 성운까지 천천히 떠오르는 2D 힐링 우주 탐험을 시작합니다.
      </p>
      <button class="launch-btn" id="launchBtn">지구 이륙 시작 (LAUNCH)</button>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ==========================================
    // 1. 캔버스 초기화 및 반응형 리사이즈
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform && ctx.resetTransform();
      ctx.scale(dpr, dpr);

    // ==========================================
    // 2. 모바일/데스크톱 Web Audio API 앰비언트 엔진
    // ==========================================
    class AmbientAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.windGain = null;
        this.windFilter = null;
        this.chimeGain = null;
        this.isMuted = false;
        this.started = false;
        this.chimeTimer = null;
        this.chimeNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
      }

      init() {
        if (this.started) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return;
        }
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.45, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          // 우주 앰비언트 바람 사운드
          const bufferSize = this.ctx.sampleRate * 2;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = (Math.random() * 2 - 1) * 0.15;
          }

          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          this.windFilter = this.ctx.createBiquadFilter();
          this.windFilter.type = 'lowpass';
          this.windFilter.frequency.setValueAtTime(260, this.ctx.currentTime);

          this.windGain = this.ctx.createGain();
          this.windGain.gain.setValueAtTime(0.08, this.ctx.currentTime);

          whiteNoise.connect(this.windFilter);
          this.windFilter.connect(this.windGain);
          this.windGain.connect(this.masterGain);
          whiteNoise.start();

          // 펜타토닉 차임
          this.chimeGain = this.ctx.createGain();
          this.chimeGain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          this.chimeGain.connect(this.masterGain);

          this.startChimeSequence();
          this.started = true;
        } catch (e) {
          console.warn('Audio Init error:', e);
        }
      }

      startChimeSequence() {
        const scheduleNext = () => {
          if (!this.started || this.isMuted) {
            this.chimeTimer = setTimeout(scheduleNext, 3000);
            return;
          }
          this.playRandomChime();
          const nextInterval = 2800 + Math.random() * 3200;
          this.chimeTimer = setTimeout(scheduleNext, nextInterval);
        };
        scheduleNext();
      }

      playRandomChime(customFreq = null) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const freq = customFreq || this.chimeNotes[Math.floor(Math.random() * this.chimeNotes.length)];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.06, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

        osc.connect(gain);
        gain.connect(this.chimeGain);
        osc.start(now);
        osc.stop(now + 3.8);
      }

      playLaunchBoom() {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 3.5);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 4.2);
      }

      setWindVelocity(intensity) {
        if (!this.ctx || !this.windFilter) return;
        const targetFreq = 200 + intensity * 600;
        const targetGain = 0.05 + intensity * 0.12;
        const now = this.ctx.currentTime;
        this.windFilter.frequency.setTargetAtTime(targetFreq, now, 0.2);
        this.windGain.gain.setTargetAtTime(targetGain, now, 0.2);
      }

      toggleMute() {
        if (!this.started) {
          this.init();
          return false;
        }
        this.isMuted = !this.isMuted;
        if (this.masterGain) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.45, this.ctx.currentTime);
        }
        return this.isMuted;
      }
    }

    // ==========================================
    // 7. 물리 시뮬레이션
    // ==========================================
    let lastTime = performance.now();

    function updatePhysics(dt) {
      if (!WORLD.isLaunched) {
        ship.x = 0;
        ship.y = -100;
        ship.angle = -Math.PI / 2;
        return;
      }

      const mult = WORLD.speedMultiplier;

      // 1) 마우스/터치 방향 실시간 추적 및 유연한 회전 (Slerp)
      const screenShipX = width / 2 + (ship.x - WORLD.camera.x) * WORLD.camera.zoom;
      const screenShipY = height / 2 + (ship.y - WORLD.camera.y) * WORLD.camera.zoom;
      const dxPointer = WORLD.pointer.x - screenShipX;
      const dyPointer = WORLD.pointer.y - screenShipY;

      if (Math.hypot(dxPointer, dyPointer) > 10) {
        ship.targetAngle = Math.atan2(dyPointer, dxPointer);
      }

      let diffAngle = (ship.targetAngle - ship.angle) % (Math.PI * 2);
      if (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
      if (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
      ship.angle += diffAngle * Math.min(1, 6.0 * dt * mult);

      // 2) 중력 닻 정박
      if (ship.isAnchored) {
        if (ship.anchoredBody) {
          ship.anchorAngle += 0.05 * dt * mult;
          const targetX = ship.anchoredBody.x + Math.cos(ship.anchorAngle) * ship.anchorDistance;
          const targetY = ship.anchoredBody.y + Math.sin(ship.anchorAngle) * ship.anchorDistance;
          ship.x += (targetX - ship.x) * 4.0 * dt;
          ship.y += (targetY - ship.y) * 4.0 * dt;
          ship.vx = 0;
          ship.vy = 0;
        } else {
          ship.vx *= Math.pow(0.05, dt * mult);
          ship.vy *= Math.pow(0.05, dt * mult);
          ship.x += ship.vx;
          ship.y += ship.vy;
        }
        return;
      }

      // 3) 상시 위쪽 부력 상승
      const baseAscend = -0.55 * mult;
      ship.vy += baseAscend * dt;

      // 4) 돛 방향 추력
      const distPointer = Math.hypot(dxPointer, dyPointer);
      const thrustPower = (1.4 + Math.min(distPointer / 350, 1.2)) * mult;
      ship.vx += Math.cos(ship.angle) * thrustPower * dt;
      ship.vy += Math.sin(ship.angle) * thrustPower * dt;

      audio.setWindVelocity(Math.min(1.5, Math.hypot(ship.vx, ship.vy) / 6));

      // 5) 천체 인력 & 반중력 쿠션
      CELESTIAL_BODIES.forEach(body => {
        const dx = body.x - ship.x;
        const dy = body.y - ship.y;
        const dist = Math.hypot(dx, dy);

        if (dist < body.gravityRadius) {
          const nx = dx / dist;
          const ny = dy / dist;

          const gravityMag = (body.mass / (dist + 150)) * 0.95 * mult;
          const gx = nx * gravityMag;
          const gy = ny * gravityMag;

          const surfaceDist = dist - body.radius;
          let repulsion = 0;
          if (surfaceDist < body.radius * 0.9) {
            const factor = 1 - Math.max(0, surfaceDist / (body.radius * 0.9));
            repulsion = factor * (gravityMag + 3.2 * mult);
          }

          const cross = nx * Math.sin(ship.angle) - ny * Math.cos(ship.angle);
          const tangentX = -ny * cross * 1.5 * mult;
          const tangentY = nx * cross * 1.5 * mult;

          ship.vx += (gx - nx * repulsion + tangentX) * dt;
          ship.vy += (gy - ny * repulsion + tangentY) * dt;

          if (Math.random() < 0.25) {
            addTrail(ship.x + (Math.random() - 0.5) * 15, ship.y + (Math.random() - 0.5) * 15, body.color);
          }
        }
      });

      // 6) 유영 감쇠 및 최고속도
      const damp = Math.pow(0.965, dt * 60 * mult);
      ship.vx *= damp;
      ship.vy *= damp;

      const currentSpeed = Math.hypot(ship.vx, ship.vy);
      const maxSpd = 8.5 * mult;
      if (currentSpeed > maxSpd) {
        ship.vx = (ship.vx / currentSpeed) * maxSpd;
        ship.vy = (ship.vy / currentSpeed) * maxSpd;
      }

      ship.x += ship.vx;
      ship.y += ship.vy;

      // 7) 꼬리 궤적 파티클
      ship.trailTimer += dt;
      if (ship.trailTimer > 0.04) {
        ship.trailTimer = 0;
        const tailX = ship.x - Math.cos(ship.angle) * 16;
        const tailY = ship.y - Math.sin(ship.angle) * 16;
        addTrail(tailX, tailY, mult > 2.0 ? '#c084fc' : '#38bdf8');
      }

      // 8) 워프 스트릭 잔상
      if (mult > 2.2 && Math.random() < 0.35) {
        warpStreaks.push({
          x: (Math.random() - 0.5) * width,
          y: (Math.random() - 0.5) * height,
          length: 40 + mult * 25,
          alpha: 0.9,
          decay: 0.045
        });
      }
    }

    // ==========================================
    // 8. 카메라 추적 시스템
    // ==========================================
    function updateCamera(dt) {
      const mult = WORLD.speedMultiplier;
      const targetX = ship.x + ship.vx * 12;
      const targetY = ship.y + ship.vy * 12;

      WORLD.camera.x += (targetX - WORLD.camera.x) * Math.min(1, 4.0 * dt * mult);
      WORLD.camera.y += (targetY - WORLD.camera.y) * Math.min(1, 4.0 * dt * mult);

      WORLD.camera.targetZoom = ship.isAnchored ? 0.7 : (mult > 2.5 ? 0.85 : 1.0);
      WORLD.camera.zoom += (WORLD.camera.targetZoom - WORLD.camera.zoom) * Math.min(1, 2.5 * dt);
    }

    // ==========================================
    // 9. 렌더링 파이프라인
    // ==========================================
    function drawSpaceBackground() {
      let topCol, botCol;
      if (ship.y > -2500) {
        topCol = '#051329';
        botCol = '#0284c7';
      } else if (ship.y > -15000) {
        topCol = '#030712';
        botCol = '#0f172a';
      } else if (ship.y > -45000) {
        topCol = '#090514';
        botCol = '#1a0b2e';
      } else {
        topCol = '#030206';
        botCol = '#12051f';
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, topCol);
      bgGrad.addColorStop(1, botCol);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 3색 오로라 성운 레이어 (시안, 마젠타, 바이올렛)
      if (ship.y < -5000) {
        const nebulaIntensity = Math.min(0.65, (-ship.y - 5000) / 40000);
        const time = performance.now() * 0.0004;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';

        const nebulaCenters = [
          { x: width * 0.3 + Math.sin(time) * 120, y: height * 0.35 + Math.cos(time * 0.8) * 80, r: 480, col: 'rgba(56, 189, 248, ' },
          { x: width * 0.75 + Math.cos(time * 0.7) * 140, y: height * 0.45 + Math.sin(time * 0.9) * 100, r: 560, col: 'rgba(236, 72, 153, ' },
          { x: width * 0.5 + Math.sin(time * 0.5) * 100, y: height * 0.7 + Math.cos(time * 0.6) * 90, r: 520, col: 'rgba(168, 85, 247, ' }
        ];

        nebulaCenters.forEach(n => {
          const g = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
          g.addColorStop(0, n.col + (0.28 * nebulaIntensity) + ')');
          g.addColorStop(0.5, n.col + (0.12 * nebulaIntensity) + ')');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, width, height);
        });

        ctx.restore();
      }
    }

    function drawStars() {
      const time = performance.now() * 0.001;
      const camX = WORLD.camera.x;
      const camY = WORLD.camera.y;
      const zoom = WORLD.camera.zoom;
      const isWarp = WORLD.speedMultiplier > 2.0;

      starLayers.forEach(layer => {
        layer.stars.forEach(star => {
          const screenX = (star.x - camX * layer.speed) * zoom + width / 2;
          const screenY = (star.y - camY * layer.speed) * zoom + height / 2;

          const wx = ((screenX % width) + width) % width;
          const wy = ((screenY % height) + height) % height;

          const twinkle = 0.4 + 0.6 * Math.sin(time * star.twinkleSpeed + star.twinklePhase);
          const alpha = Math.min(1, Math.max(0.15, twinkle));

          ctx.save();
          ctx.beginPath();

          if (isWarp) {
            const streakLen = 12 * WORLD.speedMultiplier * layer.speed;
            const moveAngle = Math.atan2(ship.vy, ship.vx);
            ctx.moveTo(wx, wy);
            ctx.lineTo(wx - Math.cos(moveAngle) * streakLen, wy - Math.sin(moveAngle) * streakLen);
            ctx.strokeStyle = star.color;
            ctx.lineWidth = star.radius * zoom;
            ctx.globalAlpha = alpha;
            ctx.stroke();
          } else {
            ctx.arc(wx, wy, star.radius * zoom, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.globalAlpha = alpha;
            ctx.fill();

            if (star.isBrightStar && star.radius > 1.8) {
              ctx.strokeStyle = star.color;
              ctx.lineWidth = 0.8;
              ctx.globalAlpha = alpha * 0.4;
              ctx.beginPath();
              ctx.moveTo(wx - 8 * zoom, wy); ctx.lineTo(wx + 8 * zoom, wy);
              ctx.moveTo(wx, wy - 8 * zoom); ctx.lineTo(wx, wy + 8 * zoom);
              ctx.stroke();
            }
          }
          ctx.restore();
        });
      });

      for (let i = warpStreaks.length - 1; i >= 0; i--) {
        const s = warpStreaks[i];
        s.alpha -= s.decay;
        if (s.alpha <= 0) {
          warpStreaks.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.beginPath();
        const moveAngle = Math.atan2(ship.vy, ship.vx);
        const sx = width / 2 + s.x;
        const sy = height / 2 + s.y;
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx - Math.cos(moveAngle) * s.length, sy - Math.sin(moveAngle) * s.length);
        ctx.strokeStyle = 'rgba(192, 132, 252, ' + s.alpha + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawCelestialBodies() {
      const camX = WORLD.camera.x;
      const camY = WORLD.camera.y;
      const zoom = WORLD.camera.zoom;
      const time = performance.now() * 0.001;

      CELESTIAL_BODIES.forEach(body => {
        const screenX = (body.x - camX) * zoom + width / 2;
        const screenY = (body.y - camY) * zoom + height / 2;
        const r = body.radius * zoom;
        const gravR = body.gravityRadius * zoom;

        if (screenX + gravR < -100 || screenX - gravR > width + 100 ||
            screenY + gravR < -100 || screenY - gravR > height + 100) {
          return;
        }

        ctx.save();
        ctx.translate(screenX, screenY);

        // 인력장 원
        ctx.beginPath();
        ctx.arc(0, 0, gravR, 0, Math.PI * 2);
        ctx.strokeStyle = body.glowColor;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([6, 10]);
        ctx.lineDashOffset = -time * 6;
        ctx.stroke();
        ctx.setLineDash([]);

        // 대기 산란광
        const halo = ctx.createRadialGradient(0, 0, r * 0.75, 0, 0, r * 1.55);
        halo.addColorStop(0, body.glowColor);
        halo.addColorStop(0.7, body.glowColor.replace('0.4', '0.1').replace('0.5', '0.12'));
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2);
        ctx.fillStyle = halo;
        ctx.fill();

        // 지구 하단 노을빛 대기층 (Sunset Glow)
        if (body.id === 'earth') {
          const sunsetGlow = ctx.createRadialGradient(0, -r * 0.85, r * 0.1, 0, 0, r * 1.08);
          sunsetGlow.addColorStop(0, 'rgba(251, 146, 60, 0.7)');
          sunsetGlow.addColorStop(0.3, 'rgba(56, 189, 248, 0.5)');
          sunsetGlow.addColorStop(1, 'rgba(3, 7, 18, 0)');
          ctx.beginPath();
          ctx.arc(0, 0, r * 1.08, 0, Math.PI * 2);
          ctx.fillStyle = sunsetGlow;
          ctx.fill();
        }

        // 구체 본체
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);

        const sphereGrad = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
        sphereGrad.addColorStop(0, '#ffffff');
        sphereGrad.addColorStop(0.25, body.color);
        sphereGrad.addColorStop(0.85, darken(body.color, 0.35));
        sphereGrad.addColorStop(1, '#02040a');
        ctx.fillStyle = sphereGrad;
        ctx.fill();

        if (body.hasBands) {
          ctx.save();
          ctx.clip();
          ctx.fillStyle = 'rgba(180, 83, 9, 0.4)';
          for (let b = -4; b <= 4; b++) {
            ctx.fillRect(-r, b * (r * 0.18), r * 2, r * 0.09);
          }
          ctx.beginPath();
          ctx.ellipse(r * 0.35, r * 0.25, r * 0.2, r * 0.12, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#b91c1c';
          ctx.fill();
          ctx.restore();
        } else if (body.hasRings) {
          ctx.save();
          ctx.rotate(0.38);
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 2.3, r * 0.55, 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
          ctx.lineWidth = 16 * zoom;
          ctx.stroke();

          ctx.beginPath();
          ctx.ellipse(0, 0, r * 1.9, r * 0.45, 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.lineWidth = 2.5 * zoom;
          ctx.stroke();
          ctx.restore();
        } else if (body.verticalRing) {
          ctx.save();
          ctx.rotate(1.4);
          ctx.beginPath();
          ctx.ellipse(0, 0, r * 1.8, r * 0.3, 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(45, 212, 191, 0.5)';
          ctx.lineWidth = 6 * zoom;
          ctx.stroke();
          ctx.restore();
        } else if (body.isSun) {
          ctx.save();
          const coronaR = r * (1.25 + Math.sin(time * 2.0) * 0.08);
          const sunGlow = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, coronaR);
          sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.8)');
          sunGlow.addColorStop(0.5, 'rgba(249, 115, 22, 0.4)');
          sunGlow.addColorStop(1, 'rgba(239, 68, 68, 0)');
          ctx.beginPath();
          ctx.arc(0, 0, coronaR, 0, Math.PI * 2);
          ctx.fillStyle = sunGlow;
          ctx.fill();
          ctx.restore();
        } else if (body.isPaleBlueDot) {
          ctx.save();
          const beamGrad = ctx.createLinearGradient(-r * 3, -r * 5, r * 3, r * 5);
          beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          beamGrad.addColorStop(0.5, 'rgba(147, 197, 253, 0.35)');
          beamGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = beamGrad;
          ctx.fillRect(-12 * zoom, -r * 6, 24 * zoom, r * 12);
          ctx.restore();
        }

        ctx.textAlign = 'center';
        ctx.font = `700 ${Math.max(11, 13 * zoom)}px 'Cinzel', serif`;
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 8;
        ctx.fillText(body.name, 0, r + 24 * zoom);

        ctx.font = `400 ${Math.max(9, 11 * zoom)}px 'Pretendard', sans-serif`;
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(body.desc, 0, r + 40 * zoom);
        ctx.shadowBlur = 0;

        ctx.restore();
      });
    }

    function darken(hex, factor) {
      if (!hex.startsWith('#')) return hex;
      const c = parseInt(hex.slice(1), 16);
      const r = Math.round(((c >> 16) & 255) * factor);
      const g = Math.round(((c >> 8) & 255) * factor);
      const b = Math.round((c & 255) * factor);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function drawTrailParticles() {
      const camX = WORLD.camera.x;
      const camY = WORLD.camera.y;
      const zoom = WORLD.camera.zoom;

      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          trailParticles.splice(i, 1);
          continue;
        }
        const sx = (p.x - camX) * zoom + width / 2;
        const sy = (p.y - camY) * zoom + height / 2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, p.radius * zoom, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.restore();
      }
    }

    function drawShip() {
      const camX = WORLD.camera.x;
      const camY = WORLD.camera.y;
      const zoom = WORLD.camera.zoom;

      const screenX = (ship.x - camX) * zoom + width / 2;
      const screenY = (ship.y - camY) * zoom + height / 2;

      ctx.save();
      ctx.translate(screenX, screenY);
      ctx.scale(zoom, zoom);

      // 중력 닻 정박 시 에너지 오라
      if (ship.isAnchored) {
        ship.glowPulse += 0.05;
        const auraR = 36 + Math.sin(ship.glowPulse) * 4;
        const aura = ctx.createRadialGradient(0, 0, 5, 0, 0, auraR);
        aura.addColorStop(0, 'rgba(56, 189, 248, 0.6)');
        aura.addColorStop(0.7, 'rgba(129, 140, 248, 0.2)');
        aura.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.beginPath();
        ctx.arc(0, 0, auraR, 0, Math.PI * 2);
        ctx.fillStyle = aura;
        ctx.fill();
      }

      // 반중력 돛 (Anti-gravity Sail)
      ctx.save();
      ctx.rotate(ship.angle);

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(24, 0);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(10, -25);
      ctx.lineTo(10, 25);
      ctx.stroke();

      const sailGrad = ctx.createLinearGradient(10, 0, -12, 0);
      sailGrad.addColorStop(0, 'rgba(56, 189, 248, 0.8)');
      sailGrad.addColorStop(0.6, 'rgba(129, 140, 248, 0.5)');
      sailGrad.addColorStop(1, 'rgba(192, 132, 252, 0.15)');

      ctx.beginPath();
      ctx.moveTo(10, -25);
      ctx.quadraticCurveTo(-14, 0, 10, 25);
      ctx.closePath();
      ctx.fillStyle = sailGrad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.restore();

      // 선체 동체
      ctx.save();
      ctx.rotate(ship.angle + Math.PI / 2);

      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(8, 12);
      ctx.lineTo(0, 8);
      ctx.lineTo(-8, 12);
      ctx.closePath();

      const hullGrad = ctx.createLinearGradient(0, -16, 0, 12);
      hullGrad.addColorStop(0, '#ffffff');
      hullGrad.addColorStop(0.5, '#cbd5e1');
      hullGrad.addColorStop(1, '#475569');
      ctx.fillStyle = hullGrad;
      ctx.fill();

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -4, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();

      ctx.restore();
    }

    // 모바일 터치 및 마우스 포인터 가이드 비주얼 (손가락 위치 인식 피드백)
    function drawPointerFeedback() {
      if (WORLD.pointer.isActive && WORLD.pointer.pulseAlpha > 0.05) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(WORLD.pointer.x, WORLD.pointer.y, 22, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(56, 189, 248, ${WORLD.pointer.pulseAlpha * 0.4})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(WORLD.pointer.x, WORLD.pointer.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${WORLD.pointer.pulseAlpha * 0.7})`;
        ctx.fill();
        ctx.restore();
      }
    }

    // HUD 갱신
    const altDisplay = document.getElementById('altDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const zoneTag = document.getElementById('zoneTag');

    let hudTimer = 0;
    function updateHUD(dt) {
      hudTimer += dt;
      if (hudTimer > 0.08) {
        hudTimer = 0;
        const currentAltKm = Math.max(0, Math.floor(-ship.y / 1.2));
        altDisplay.textContent = currentAltKm.toLocaleString();

        const spdKn = Math.round(Math.hypot(ship.vx, ship.vy) * 25 * WORLD.speedMultiplier);
        speedDisplay.textContent = spdKn;

        let currentZone = '지구 대기권 구역 (Troposphere)';
        for (let i = CELESTIAL_BODIES.length - 1; i >= 0; i--) {
          if (ship.y <= CELESTIAL_BODIES[i].y + 1200) {
            currentZone = CELESTIAL_BODIES[i].name;
            break;
          }
        }
        if (zoneTag.textContent !== currentZone) {
          zoneTag.textContent = currentZone;
        }

        updateMinimap();
      }
    }

    // 메인 루프
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      updatePhysics(dt);
      updateCamera(dt);
      updateHUD(dt);

      ctx.clearRect(0, 0, width, height);
      drawSpaceBackground();
      drawStars();
      drawCelestialBodies();
      drawTrailParticles();
      drawShip();
      drawPointerFeedback();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

  })();
  </script>
</body>
</html>
